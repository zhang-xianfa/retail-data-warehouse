<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品品类与热销分析 - 惠民零售集团</title>
    <script src="../js/echarts.min.js"></script>
    <script src="../js/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; margin: 0; padding: 20px; background: #f2f4f7; color: #303133; }
        .header { background: linear-gradient(90deg, #27ae60, #1e8449); color: #fff;
                  padding: 16px 24px; border-radius: 8px; margin-bottom: 16px; }
        .header h2 { margin: 0; font-size: 20px; }
        .header p { margin: 6px 0 0; font-size: 13px; opacity: .85; }
        .card { background: #fff; border-radius: 8px; padding: 16px 20px;
                box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; }
        .toolbar input, .toolbar select { padding: 6px 10px; font-size: 14px;
                border: 1px solid #dcdfe6; border-radius: 4px; }
        .toolbar button { padding: 7px 22px; font-size: 14px; color: #fff; background: #27ae60;
                border: none; border-radius: 4px; cursor: pointer; }
        .toolbar button:hover { background: #1e8449; }
        .row { display: flex; gap: 16px; flex-wrap: wrap; }
        .col { flex: 1 1 420px; background: #fff; border-radius: 8px; padding: 12px;
               box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .chart { width: 100%; height: 420px; }
        .api { font-family: Consolas, monospace; font-size: 12px; color: #909399;
               background: #f5f7fa; padding: 8px 12px; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="header">
    <h2>惠民零售集团 · 商品品类与热销商品分析</h2>
    <p>数据来源：Hive 数仓 hui_min_dwd.dwd_trade_detail ｜ 品类口径：生鲜 / 日用品 / 家电</p>
</div>

<div class="card">
    <div class="toolbar">
        <label>业务日期：</label>
        <input type="date" id="dt" value="2024-05-20">
        <label>商品数量：</label>
        <select id="topN">
            <option value="5">TOP5</option>
            <option value="10" selected>TOP10</option>
            <option value="15">TOP15</option>
        </select>
        <button id="queryBtn">查询</button>
    </div>
    <div class="api" id="apiInfo"></div>
</div>

<div class="row">
    <div class="col"><div id="pieChart" class="chart"></div></div>
    <div class="col"><div id="goodsChart" class="chart"></div></div>
</div>

<div class="row">
    <div class="col"><div id="payChart" class="chart"></div></div>
    <div class="col"><div id="regionChart" class="chart"></div></div>
</div>

<script>
    var pieChart    = echarts.init(document.getElementById('pieChart'));
    var goodsChart  = echarts.init(document.getElementById('goodsChart'));
    var payChart    = echarts.init(document.getElementById('payChart'));
    var regionChart = echarts.init(document.getElementById('regionChart'));
    var allCharts = [pieChart, goodsChart, payChart, regionChart];
    window.addEventListener('resize', function () {
        allCharts.forEach(function (c) { c.resize(); });
    });

    var PALETTE = ['#2f7ed8', '#27ae60', '#e67e22', '#8e44ad', '#16a085', '#c0392b'];

    function emptyTip(chart, text) {
        chart.clear();
        chart.setOption({ title: { text: text, left: 'center', top: 'center',
                                   textStyle: { color: '#909399', fontSize: 15 } } });
    }

    function loadData() {
        var dt   = $('#dt').val().replace(/-/g, '');
        var topN = $('#topN').val();
        if (!/^\d{8}$/.test(dt)) { alert('请选择合法的业务日期'); return; }
        $('#apiInfo').text('接口地址：GET /api/retail/category/share?dt=' + dt +
                           ' ｜ GET /api/retail/goods/top10?dt=' + dt + '&topN=' + topN +
                           ' ｜ GET /api/retail/pay/dist?dt=' + dt +
                           ' ｜ GET /api/retail/region/sales?dt=' + dt);

        // ① 品类销售占比（饼图）
        $.get('/api/retail/category/share', { dt: dt }, function (res) {
            if (res.code !== 200 || !res.data || !res.data.length) { emptyTip(pieChart, '暂无数据'); return; }
            pieChart.clear();
            pieChart.setOption({
                title: { text: '各品类销售额占比', left: 'center', textStyle: { fontSize: 15 } },
                tooltip: { trigger: 'item', formatter: '{b}<br/>销售额：{c} 元（{d}%）' },
                legend: { bottom: 4 },
                color: PALETTE,
                series: [{ type: 'pie', radius: ['40%', '66%'], center: ['50%', '52%'],
                           label: { formatter: '{b}\n{c} 元', fontSize: 11 },
                           data: res.data.map(function (d) {
                               return { name: d.categoryName, value: Number(d.salesAmount) };
                           }) }]
            });
        }, 'json').fail(function () { emptyTip(pieChart, '接口请求失败'); });

        // ② 热销商品 TOP N（条形图）
        $.get('/api/retail/goods/top10', { dt: dt, topN: topN }, function (res) {
            if (res.code !== 200 || !res.data || !res.data.length) { emptyTip(goodsChart, '暂无数据'); return; }
            var list = res.data.slice().reverse();
            goodsChart.clear();
            goodsChart.setOption({
                title: { text: '商品销售额 TOP' + res.data.length, left: 'center', textStyle: { fontSize: 15 } },
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                grid: { left: '3%', right: '12%', top: 50, bottom: 20, containLabel: true },
                xAxis: { type: 'value', name: '销售额(元)' },
                yAxis: { type: 'category', data: list.map(function (d) { return d.categoryName; }),
                         axisLabel: { fontSize: 10 } },
                series: [{ type: 'bar', data: list.map(function (d) { return Number(d.salesAmount); }),
                           barMaxWidth: 20, itemStyle: { color: '#e67e22', borderRadius: [0, 4, 4, 0] },
                           label: { show: true, position: 'right', fontSize: 10 } }]
            });
        }, 'json').fail(function () { emptyTip(goodsChart, '接口请求失败'); });

        // ③ 支付方式分布（饼图）
        $.get('/api/retail/pay/dist', { dt: dt }, function (res) {
            if (res.code !== 200 || !res.data || !res.data.length) { emptyTip(payChart, '暂无数据'); return; }
            payChart.clear();
            payChart.setOption({
                title: { text: '支付方式交易笔数分布', left: 'center', textStyle: { fontSize: 15 } },
                tooltip: { trigger: 'item', formatter: '{b}<br/>交易笔数：{c} 笔（{d}%）' },
                legend: { bottom: 4 },
                color: PALETTE,
                series: [{ type: 'pie', radius: '58%', center: ['50%', '52%'],
                           label: { formatter: '{b}\n{c} 笔', fontSize: 11 },
                           data: res.data.map(function (d) {
                               return { name: d.categoryName, value: Number(d.tradeCnt) };
                           }) }]
            });
        }, 'json').fail(function () { emptyTip(payChart, '接口请求失败'); });

        // ④ 各大区销售对比（柱状图）
        $.get('/api/retail/region/sales', { dt: dt }, function (res) {
            if (res.code !== 200 || !res.data || !res.data.length) { emptyTip(regionChart, '暂无数据'); return; }
            regionChart.clear();
            regionChart.setOption({
                title: { text: '各大区销售额对比', left: 'center', textStyle: { fontSize: 15 } },
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                grid: { left: '3%', right: '6%', top: 50, bottom: 20, containLabel: true },
                xAxis: { type: 'category', data: res.data.map(function (d) { return d.storeRegion; }) },
                yAxis: { type: 'value', name: '销售额(元)' },
                series: [{ type: 'bar', barMaxWidth: 60,
                           data: res.data.map(function (d) { return Number(d.salesAmount); }),
                           itemStyle: { color: '#27ae60', borderRadius: [4, 4, 0, 0] },
                           label: { show: true, position: 'top', fontSize: 11 } }]
            });
        }, 'json').fail(function () { emptyTip(regionChart, '接口请求失败'); });
    }

    $('#queryBtn').click(loadData);
    $(function () { loadData(); });
</script>
</body>
</html>
